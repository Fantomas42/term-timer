<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="term-timer">
  <title>term-timer</title>
  <defs>
    <linearGradient id="icon-evening-grad" x1="12" y1="6" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0.0000" stop-color="#00FFFF"/>
      <stop offset="0.1429" stop-color="#00D7FF"/>
      <stop offset="0.2857" stop-color="#00AFFF"/>
      <stop offset="0.4286" stop-color="#5F87FF"/>
