<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}{% endblock %}">
    <meta name="generator" content="Term Timer">
    <meta name="pubdate" content="{{ now.strftime('%Y-%m-%d') }}">
    <title>Term Timer - {% block title %}{% endblock %}</title>
    <link rel="icon" href="/static/img/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
    <link rel="manifest" href="/static/img/site.webmanifest">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="/static/js/main.js"></script>
    {% block script %}
    {% endblock %}
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">
          <i class="fas fa-cube"></i>
          <h1>
            <a href="/">
              Term Timer
            </a>
            <span class="subtitle">{% block subtitle %}{% endblock %}</span>
          </h1>
        </div>
        <div class="actions">
          {% block actions %}
            <div class="header-nav">
              {% block nav_actions %}{% endblock %}
            </div>
            <div class="header-selectors">
              {% block selectors %}{% endblock %}
            </div>
          {% endblock %}
        </div>
      </header>
      {% block body %}
      {% endblock %}
    </div>
  </body>
</html>
