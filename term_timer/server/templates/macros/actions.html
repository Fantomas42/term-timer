{% macro algorithm_button_detail(algorithm) %}
  <a href="/algorithm/{{ algorithm }}/" class="algorithm-detail">
    <i class="fas fa-info-circle"></i>
    Details
  </a>
{% endmacro %}


{% macro algorithm_button_copy(algorithm) %}
  <button class="algorithm-copy" data-algorithm="{{ algorithm }}">
    <i class="fas fa-copy"></i>
    Copy
  </button>
{% endmacro %}
