{% macro mastery_gauge(status) %}
  <svg class="mastery-gauge" viewBox="0 0 100 4" preserveAspectRatio="none"
       role="img" aria-label="{{ status.mastered }} of {{ status.total }} cases mastered">
    <rect class="mastery-track" x="0" y="0" width="100" height="4"></rect>
    <rect class="mastery-fill" x="0" y="0" width="{{ status.mastery }}" height="4"></rect>
  </svg>
{% endmacro %}
