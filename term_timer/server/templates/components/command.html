{#- A terminal command with its copy button: the viewer never starts a
    solve, it tells how to. -#}
{% from 'components/button.html' import copy_button %}

{% macro command(text, key='') -%}
  <div class="command">
    <code class="command-text"><span class="command-prompt" aria-hidden="true">$</span> {{ text }}</code>
    {{ copy_button(text, 'command', key) }}
  </div>
{%- endmacro %}
